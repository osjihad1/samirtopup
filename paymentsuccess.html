<!DOCTYPE html>
<html lang="en-BD">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - SAMIR TOPUP</title>
  <meta name="theme-color" content="#042d49">
  <link rel="icon" type="image/png" href="images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at 50% 30%, #08243e, #041c30); padding: 40px 16px;">

  <div style="width: 100%; max-width: 480px; text-align: center;">
    
    <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <h1 style="font-size: 26px; font-weight: 800; color: white;">Order Placed Successfully!</h1>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 6px;">
      Your payment was received. In-game diamonds/credits are being delivered automatically.
    </p>

    <!-- Receipt Card -->
    <div class="topup-card" style="text-align: left; margin: 24px 0; padding: 22px;">
      <div class="summary-row">
        <span>Order Reference:</span>
        <strong id="rcptOrderId" style="color: #38bdf8;">ST-98214</strong>
      </div>
      <div class="summary-row">
        <span>Amount Paid:</span>
        <strong id="rcptAmount" style="color: #ff6702;">৳80</strong>
      </div>
      <div class="summary-row">
        <span>Delivery Status:</span>
        <span style="color: #34d399; font-weight: 700;">Processing (1-3 mins)</span>
      </div>
      <div class="summary-row">
        <span>Support:</span>
        <span style="color: #cbd5e1;">Telegram @SamirTopuphelp</span>
      </div>
    </div>

    <div style="display: flex; gap: 12px; justify-content: center;">
      <a href="profile.html" class="btn-buy-now" style="margin-top: 0; width: auto; padding: 12px 24px; text-decoration: none;">
        Track in Orders
      </a>
      <a href="index.html" class="btn-login" style="background: rgba(255,255,255,0.1); padding: 12px 20px;">
        Back to Home
      </a>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ordId = params.get("orderId") || ("ST-" + Math.floor(10000 + Math.random() * 90000));
    const amt = params.get("amount") || "80";

    document.getElementById("rcptOrderId").textContent = ordId;
    document.getElementById("rcptAmount").textContent = `৳${amt}`;
  </script>
</body>
</html>
