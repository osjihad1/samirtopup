<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="50%" stop-color="#ff4500" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Diamond Shield with S -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield Glow -->
    <polygon points="42,0 80,22 70,68 42,84 14,68 4,22" fill="#061a2c" stroke="url(#gradPrimary)" stroke-width="3" filter="url(#glow)" />
    <!-- Inner Accent Shield -->
    <polygon points="42,7 72,25 64,62 42,76 20,62 12,25" fill="#041220" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Diamond Top Crown -->
    <polygon points="42,12 55,25 42,32 29,25" fill="url(#gradCyan)" />
    <polygon points="29,25 42,32 42,38 24,30" fill="#0284c7" />
    <polygon points="55,25 42,32 42,38 60,30" fill="#38bdf8" />

    <!-- Stylized "S" Lightning Monogram -->
    <path d="M48,34 L32,46 L42,47 L30,68 L52,49 L41,48 Z" fill="url(#gradGold)" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <!-- "SAMIR" -->
  <text x="105" y="52" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="#ffffff">
    SAMIR
  </text>
  <text x="242" y="52" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="url(#gradPrimary)">
    TOPUP
  </text>

  <!-- Tagline / Subtitle -->
  <rect x="106" y="64" width="85" height="3" rx="1.5" fill="url(#gradPrimary)" />
  <text x="200" y="73" font-family="'Hind Siliguri', 'Poppins', sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.8" fill="#94a3b8">
    FAST &amp; RELIABLE GAME TOPUP
  </text>
</svg>

