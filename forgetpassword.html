<!DOCTYPE html>
<html lang="en-BD">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SAMIR TOPUP</title>
  <meta name="theme-color" content="#042d49">
  <link rel="icon" type="image/png" href="images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at 50% 30%, #08243e, #041c30);">

  <div style="width: 100%; max-width: 440px; padding: 24px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html">
        <img src="images/samir_logo.svg" alt="SAMIR TOPUP" style="height: 52px;">
      </a>
      <h1 style="font-size: 24px; font-weight: 800; color: white; margin-top: 10px;">Reset Password</h1>
      <p style="color: #94a3b8; font-size: 14px;">Enter your email or phone to receive a reset code</p>
    </div>

    <div class="topup-card" style="padding: 28px;">
      <form onsubmit="handleReset(event)">
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">
            Email or Phone Number
          </label>
          <input type="text" id="resetInput" class="input-field" placeholder="017XXXXXXXX or user@example.com" required>
        </div>

        <button type="submit" class="btn-buy-now" style="margin-top: 0; width: 100%;">
          Send Reset Instructions
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13px;">
        <a href="login.html" style="color: #ff6702; text-decoration: none; font-weight: 600;">← Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      showToast("Reset link sent! Please check your SMS or Email.", "success");
      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    }
  </script>
</body>
</html>
